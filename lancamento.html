<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Caique Braga Nunes">
    <meta name="description" content="Página criada para estudo de HTML e CSS">
    <meta name="keywords" content="Programação, HTML5, CSS3">
    <title>Ford | Lançamento</title>
    <link rel="icon" href="./img/icon2.png" type="image/png">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <header class="cabecalho">
            <a href="index.html"><img src="./img/logo-ford-256.png" alt="Logo Ford maior"></a>
        <nav class="cabecalho__menu">
            <a href="index.html">Home</a>
            <a href="lancamento.html">Lançamento</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="principal__lancamento">
        <iframe width="1269" height="713.7" src="https://www.youtube.com/embed/vQsryuNmsL0" title="Ford Ranger 2022 | Gerações" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <section>
            <ul class="principal__lancamento__lista">
                <li class="principal__lancamento__lista__carros">
                    <img src="./img/XL Cabine.jpg" alt="XL Cabine Simples">
                    <div class="principal__lancamento__lista__carros__linha">
                        <label class="principal__lancamento__lista__carros__checkbox" for="xl-cabine-simples">
                        <input type="checkbox" value="" id="xl-cabine-simples">
                            <div class="principal__lancamento__lista__carros__coluna">
                                <p class="principal__lancamento__lista__carros__titulo">XL Cabine Simples 2.2 Diesel 4X4 MT 2022</p>
                                <p class="principal__lancamento__lista__carros__valor">Preço Sugerido: R$ 183.850</p>
                            </div> 
                        </label>
                    <div class="principal__lancamento__lista__carros__info">
                        <img src="./img/info.png" alt="info">
                    </div>
                    </div>
                </li>
                <li class="principal__lancamento__lista__carros">
                    <img src="./img/xls 2.2 diesel.jpg" alt="XLS">
                    <div class="principal__lancamento__lista__carros__linha">
                        <label class="principal__lancamento__lista__carros__checkbox" for="XLS">
                        <input type="checkbox" value="" id="XLS">
                            <div class="principal__lancamento__lista__carros__coluna">
                                <p class="principal__lancamento__lista__carros__titulo">XLS 2.2 Diesel 4X4 AT 2022</p>
                                <p class="principal__lancamento__lista__carros__valor">Preço Sugerido: R$ 220.690</p>
                            </div> 
                        </label>
                    <div class="principal__lancamento__lista__carros__info">
                        <img src="./img/info.png" alt="info">
                    </div>
                    </div>
                </li>
                <li class="principal__lancamento__lista__carros">
                    <img src="./img/storm.jpg" alt="Storm">
                    <div class="principal__lancamento__lista__carros__linha">
                        <label class="principal__lancamento__lista__carros__checkbox" for="Storm">
                        <input type="checkbox" value="" id="Storm">
                            <div class="principal__lancamento__lista__carros__coluna">
                                <p class="principal__lancamento__lista__carros__titulo">Storm 3.2 Diesel 4X4 AT 2022</p>
                                <p class="principal__lancamento__lista__carros__valor">Preço Sugerido: R$ 222.790</p>
                            </div> 
                        </label>
                    <div class="principal__lancamento__lista__carros__info">
                        <img src="./img/info.png" alt="info">
                    </div>
                    </div>
                </li>
            </ul>
        </section>
        <button type="submit" class="principal__lancamento__botao">Comparar Carros</button>
    </main>

    <footer class="rodape">
        <div class="rodape__redes_sociais">
                <p>Redes Sociais:</p>
                <a href="https://web.facebook.com/FordBrasil" target="_blank"><img src="./img/facebook-50.png" alt="Facebook"></a>
                <a href="https://www.youtube.com/FordBrasil" target="_blank"><img src="./img/youtube-squared-50.png" alt="YouTube"></a>
                <a href="https://www.instagram.com/FordBrasil" target="_blank"><img src="./img/instagram-logo-50.png" alt="Instagram"></a>
        </div>
        <p class="rodape__direitos_autorais">© 2026 Ford Brasil | Viva o Novo. Todos os direitos reservados.</p>
        <section>
            <img src="./img/ford-96.png" alt="Logo Ford menor">
        </section>
    </footer>
</body>
</html>
